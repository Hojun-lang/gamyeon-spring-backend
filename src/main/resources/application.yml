spring:
  application:
    name: gamyeon-backend
  cloud:
    compatibility-verifier:
      enabled: false
    openfeign:
      client:
        config:
          ai-report-client:
            connect-timeout: 3000
            read-timeout: 180000
      circuitbreaker:
        enabled: false  # Feign 자동 통합 비활성 — @CircuitBreaker 수동 방식 사용
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
# ── 서버 설정 (spring.* 네임스페이스 충돌 방지를 위해 분리) ────────────────────
server:
  callback-base-url: ${SPRING_INTERNAL_BASE_URL:http://spring-server:8080}


# ── Report 설정 ────────────────────────────────────────────────────────────
report:
  total-question-count: 7
  scheduler:
    timeout-minutes: 5

# ── Resilience4j 서킷 브레이커 ──────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      aiReportClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 200s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}

jwt:
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

ai:
  server:
    url: ${AI_SERVER_URL:http://agent-server:8000}